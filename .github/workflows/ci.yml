name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: [self-hosted, box]


    steps:
      # Postgres 17 runs inside the box runner (GITHUB-PRIVATE-1128), thrown away with it.
      - name: Create the test database
        run: createdb -h localhost -U postgres -O test human_test
        env:
          PGPASSWORD: postgres
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run migrations
        env:
          HUMAN_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/human_test
        run: npx drizzle-kit migrate

      - name: Run tests
        env:
          HUMAN_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/human_test
          HUMAN_SERVICE_API_KEY: test-api-key
        run: npm test
